<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101714"><meta name="description" content="小杨的贪吃蛇：方向键、WASD、手机滑动都能玩。"><title>贪吃蛇 · 小杨的游戏厅</title>
<style>
:root{--bg:#101714;--panel:#17221c;--line:#34463a;--ink:#ecf1e5;--muted:#adbaa9;--mint:#b5ed83;--amber:#f7b956}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}button,select{min-height:46px}button{cursor:pointer}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--amber);outline-offset:4px}button:disabled{opacity:.4;cursor:not-allowed}header,main,footer{max-width:1060px;margin:auto;padding-inline:30px}header{padding-block:25px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:600 14px ui-monospace,monospace;letter-spacing:.2em;color:var(--mint)}.owner{color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:minmax(0,580px) minmax(220px,1fr);gap:46px;padding-top:35px;padding-bottom:28px}.board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{font-size:23px;font-weight:500;letter-spacing:.12em;margin:0}.live-state{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{height:6px;width:6px;background:var(--mint);border-radius:50%}.stage{position:relative;padding:9px;border:1px solid var(--line);background:#0c130f;border-radius:8px}.stage canvas{display:block;width:100%;aspect-ratio:1;touch-action:none;border-radius:3px}.overlay{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0c130fd9;text-align:center;padding:24px}.overlay[hidden]{display:none}.overlay .overline{font:11px ui-monospace,monospace;color:var(--mint);letter-spacing:.22em}.overlay h2{font-size:28px;font-weight:500;margin:17px 0 10px;letter-spacing:.13em}.overlay p{color:var(--muted);font-size:13px;line-height:1.9;margin:0 0 22px}.primary{background:var(--mint);color:#172313;border:0;padding:13px 28px;border-radius:4px;font-weight:600;font-size:13px}.primary:hover{background:#c6f3a2}.board-caption{margin:11px 0 0;display:flex;justify-content:space-between;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.1em}.sidebar{padding-top:38px}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:22px;gap:20px}.label{font-size:11px;color:var(--muted);margin:0 0 9px;letter-spacing:.1em}.number{font:42px ui-monospace,monospace;letter-spacing:-.04em;margin:0}.number.best{color:var(--mint)}.settings{padding-block:23px;border-bottom:1px solid var(--line)}.select-row{display:flex;align-items:center;justify-content:space-between;gap:15px}.select-row label{font-size:13px}select{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:9px 14px;border-radius:4px;max-width:140px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.secondary{background:none;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;font-size:12px}.secondary:hover{background:var(--panel)}.instructions{padding-top:23px}.instructions h2{font-size:13px;font-weight:500;margin:0 0 15px}.instructions p{font-size:12px;line-height:1.9;color:var(--muted);margin:8px 0}.key{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:3px;padding:3px 5px;color:var(--ink)}.rules{border-top:1px solid var(--line);padding-top:14px;margin-top:18px!important}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center;margin-top:22px}.pad button{background:var(--panel);color:var(--mint);border:1px solid var(--line);border-radius:4px;font-size:20px;touch-action:manipulation}.pad button:active{background:var(--line)}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}footer{border-top:1px solid var(--line);padding-block:18px;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:15px;line-height:1.8}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:760px){header,main,footer{padding-inline:18px}header{padding-block:18px}.owner{font-size:10px}main{display:flex;flex-direction:column;gap:18px;padding-top:22px}.board-head{margin-bottom:12px}.sidebar{padding-top:0;display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats{padding-block:15px;gap:12px}.number{font-size:31px}.settings{padding:0;border:0}.select-row{gap:7px}.select-row label{font-size:11px}select{font-size:11px;max-width:110px}.controls{margin-top:10px;gap:7px}.instructions{grid-column:1/-1;padding-top:0;display:grid;grid-template-columns:1fr 180px;gap:10px}.instructions h2{display:none}.pad{margin:0;align-self:center}.rules{margin-top:8px!important;padding-top:8px}.overlay h2{font-size:25px}.overlay p{font-size:12px}.board-caption{font-size:9px}footer{font-size:9px}}@media(max-width:360px){.instructions{grid-template-columns:1fr}.pad{margin:5px 0}.sidebar{gap:8px}.number{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@font-face{font-family:SnakeChinese;src:url('snake-font.woff2') format('woff2');font-display:swap}body{font-family:SnakeChinese,sans-serif}.key,.board-caption{font-family:ui-monospace,SnakeChinese,monospace}</style></head><body>
<header><span class="brand">SNAKE / CLUB</span><span class="owner">小杨的游戏厅 · 随时来一局</span></header>
<main><section aria-label="游戏棋盘"><div class="board-head"><h1>贪吃蛇</h1><span class="live-state"><i class="dot" aria-hidden="true"></i><span id="state">等待开始</span></span></div><div class="stage"><canvas id="board" width="600" height="600" tabindex="0" aria-label="贪吃蛇棋盘，使用方向键或WASD移动"></canvas><div class="overlay" id="overlay"><span class="overline" id="overline">ONE MORE BITE</span><h2 id="overlay-title">吃一口，再长一点。</h2><p id="overlay-copy">吃掉金色食物，别撞到墙或自己。<br>手机滑动棋盘，也能控制方向。</p><button class="primary" id="play">开始游戏</button></div></div><div class="board-caption"><span>20 × 20 / CLASSIC MODE</span><span>吃一个 +10 分</span></div></section>
<aside class="sidebar"><div class="stats"><div><p class="label">本局得分</p><p class="number" id="score">000</p></div><div><p class="label">最高纪录</p><p class="number best" id="best">000</p></div></div><div class="settings"><div class="select-row"><label for="difficulty">游戏速度</label><select id="difficulty"><option value="easy">悠闲</option><option value="normal" selected>标准</option><option value="fast">挑战</option></select></div><div class="controls"><button class="secondary" id="pause" disabled>暂停</button><button class="secondary" id="restart">重新开始</button></div></div><div class="instructions"><div><h2>控制很简单</h2><p><span class="key">↑ ↓ ← →</span> / <span class="key">W A S D</span> 移动</p><p><span class="key">空格</span> 暂停　<span class="key">R</span> 重开</p><p class="rules">手机：滑动棋盘或点方向按钮。<br>切到后台会自动暂停。</p></div><div class="pad" role="group" aria-label="触屏方向控制"><button class="up" data-dir="up" aria-label="向上">↑</button><button class="left" data-dir="left" aria-label="向左">←</button><button class="down" data-dir="down" aria-label="向下">↓</button><button class="right" data-dir="right" aria-label="向右">→</button></div></div></aside></main>
<footer><span>没有账号，没有广告。最高分仅保存在当前浏览器，各速度分别记录。</span><span>LIUYANGDEV.SITE</span></footer><p class="sr" id="announcement" aria-live="polite"></p>
<script src="snake-engine.js?v=snake1"></script><script src="game.js?v=snake1"></script></body></html>
