<style>
:root{--paper:#f4f1e9;--ink:#293b32;--muted:#626c60;--line:#d4d7c9;--accent:#496d54;--wash:#e6e9dc;--field:#faf8f2;--orb:#a6b59c;--glow:#d9dfc9}

<section class="intro" aria-labelledby="heading"><div><p class="eyebrow">A LITTLE ROOM FOR YOURSELF</p><h1 id="heading">世界很快，<br>这里可以<em>慢一点。</em></h1><p class="description" id="quote">把没有做完的事暂时放下。<br>这一小会儿，只属于你。</p><button class="breath-button" id="breath" aria-pressed="false">开始一轮呼吸</button><p class="breath-help">轻轻吸气，缓缓呼气。按自己舒服的节奏就好。<br>若觉得不适，随时停下，不必跟完。</p><p class="status" id="breath-status" aria-live="polite">准备好了，就从一次呼吸开始。</p></div><div class="landscape" aria-label="呼吸引导"><div class="rings" aria-hidden="true"></div><div class="orb" id="orb"><span id="phase">静一静</span></div><span class="landscape-label" id="cycle">不着急，慢慢来</span></div></section>
<section class="workspace" aria-label="休息工具"><div class="sound"><div class="section-head"><h2>让背景安静下来</h2><span class="tiny">SOUND SPACE</span></div><div class="sound-choices" role="group" aria-label="选择环境音"><button class="sound-choice" data-sound="rain" aria-pressed="true">雨声</button><button class="sound-choice" data-sound="sea" aria-pressed="false">海浪</button><button class="sound-choice" data-sound="wind" aria-pressed="false">林间风</button></div><div class="sound-bottom"><button class="audio-toggle" id="audio" aria-label="播放环境音" aria-pressed="false">▶</button><div class="audio-meta"><p id="sound-name">窗外的雨</p><small id="audio-status" aria-live="polite">点一下播放 · 默认轻音量</small></div><input id="volume" type="range" min="0" max="100" value="25" aria-label="环境音音量"><span id="volume-value" class="volume-value">25%</span></div></div><div class="note"><div class="section-head"><h2>先把心事放在这里</h2><span class="tiny">JUST FOR YOU</span></div><textarea id="note" maxlength="2000" aria-label="写下此刻的心事" placeholder="想到什么就写下来，不必写得完整。"></textarea><div class="note-bottom"><span class="note-status" id="save-state" aria-live="polite">只保存在当前浏览器，不会上传</span><button class="text-button" id="clear">清空这页</button></div></div></section>
<footer class="closing"><p id="foot-quote">你不需要把每一分钟，都变成有用的一分钟。<br><button id="another" class="muted-link">换一句话</button></p><p>环境音为浏览器实时合成，无需外部音频。<br>这里只是一个休息角落，不提供医疗建议。</p></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}},remove(k){try{localStorage.removeItem(k)}catch{}}};
let scene=store.get('slowroom-scene')||'day';
function renderScene(){document.body.dataset.scene=scene;$('scene').textContent=scene==='day'?'切换夜色':'切换日光';$('scene').setAttribute('aria-label',scene==='day'?'切换为夜色主题':'切换为日光主题')}
renderScene();$('scene').onclick=()=>{scene=scene==='day'?'night':'day';store.set('slowroom-scene',scene);renderScene()};
$('note').value=store.get('slowroom-note')||'';
$('note').oninput=()=>{$('save-state').textContent=store.set('slowroom-note',$('note').value)?'已保存在此浏览器 · 不会上传':'浏览器不允许保存，请自行保留文字'};
$('clear').onclick=()=>{if($('note').value && !confirm('清空这页文字？清空后无法恢复。'))return;$('note').value='';store.remove('slowroom-note');$('save-state').textContent='已清空 · 不会上传'};
const quotes=['你不需要把每一分钟，都变成有用的一分钟。','今天就到这里，也可以。','暂时放下，不代表放弃。','一件事一件事来，一口气一口气呼吸。','不用急着回应世界，先听听自己。'];let quoteIndex=0;
$('another').onclick=()=>{quoteIndex=(quoteIndex+1)%quotes.length;$('foot-quote').firstChild.textContent=quotes[quoteIndex]};
let breathActive=false,breathTimer=null,breathStart=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopBreath(done=false){breathActive=false;clearInterval(breathTimer);$('breath').textContent='开始一轮呼吸';$('breath').setAttribute('aria-pressed','false');$('orb').style.transform='scale(1)';$('phase').textContent=done?'很好':'静一静';$('cycle').textContent=done?'这一分钟，留给了自己':'不着急，慢慢来';$('breath-status').textContent=done?'一轮结束。可以继续坐一会儿。':'已暂停。回到自己的呼吸节奏。'}
function tickBreath(){const elapsed=(Date.now()-breathStart)/1000;if(elapsed>=60){stopBreath(true);return}const inhale=elapsed%10<4;$('phase').textContent=inhale?'吸气':'呼气';$('orb').style.transitionDuration=inhale?'4s':'6s';$('orb').style.transform=reduce?'scale(1)':inhale?'scale(1.18)':'scale(.88)';$('cycle').textContent=`第 ${Math.floor(elapsed/10)+1} / 6 次呼吸`;$('breath-status').textContent=inhale?'轻轻吸气，不用刻意吸满。':'缓缓呼气，让肩膀放松一点。'}
$('breath').onclick=()=>{if(breathActive){stopBreath();return}breathActive=true;breathStart=Date.now();$('breath').textContent='暂停呼吸引导';$('breath').setAttribute('aria-pressed','true');tickBreath();breathTimer=setInterval(tickBreath,200)};
let ctx,source,filter,gain,lfo,lfoGain,playing=false,sound='rain';const names={rain:'窗外的雨',sea:'远处的海',wind:'林间的风'};
function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('浏览器不支持音频');ctx=new AC();const length=ctx.sampleRate*4,buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);let last=0;for(let i=0;i<length;i++){last=(last+Math.random()*.04-.02)/1.02;data[i]=last*3.5}source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;filter=ctx.createBiquadFilter();filter.type='lowpass';gain=ctx.createGain();gain.gain.value=0;lfo=ctx.createOscillator();lfo.type='sine';lfoGain=ctx.createGain();lfo.connect(lfoGain);lfoGain.connect(filter.frequency);source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);source.start();lfo.start();configureSound()}
function configureSound(){if(!ctx)return;const t=ctx.currentTime;filter.frequency.setTargetAtTime({rain:2200,sea:650,wind:1100}[sound],t,.6);lfo.frequency.setValueAtTime(sound==='sea'?.12:.045,t);lfoGain.gain.setValueAtTime(sound==='sea'?400:sound==='wind'?650:80,t);setVolume()}
function setVolume(){if(ctx)gain.gain.setTargetAtTime(playing?Number($('volume').value)/100*.35:0,ctx.currentTime,.2)}
function renderAudio(){$('audio').textContent=playing?'Ⅱ':'▶';$('audio').setAttribute('aria-pressed',String(playing));$('audio').setAttribute('aria-label',playing?'暂停环境音':'播放环境音');$('audio-status').textContent=playing?'正在播放 · 合成环境音':'已暂停 · 点一下继续'}
$('audio').onclick=async()=>{try{if(!ctx)initAudio();await ctx.resume();playing=!playing;setVolume();renderAudio()}catch(e){$('audio-status').textContent='音频暂时不可用，请换浏览器重试';playing=false;setVolume()}};
document.querySelectorAll('[data-sound]').forEach(button=>button.onclick=()=>{sound=button.dataset.sound;document.querySelectorAll('[data-sound]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));$('sound-name').textContent=names[sound];configureSound()});
$('volume').oninput=()=>{$('volume-value').textContent=$('volume').value+'%';setVolume()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&breathActive)stopBreath()});
window.addEventListener('pagehide',()=>{clearInterval(breathTimer);if(ctx)ctx.close()});
</script>
</body></html>
