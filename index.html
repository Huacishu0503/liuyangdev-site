<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>去水印 · 图片橡皮擦</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; padding: 28px 16px 12px; }
  header h1 { font-size: 26px; letter-spacing: 2px; }
  header h1 span { color: #e94560; }
  header p { color: #aaa; font-size: 13px; margin-top: 8px; }
  .steps { display: flex; gap: 8px; margin: 12px 0 4px; font-size: 12px; color: #888; flex-wrap: wrap; justify-content: center; }
  .steps b { color: #e94560; font-weight: 600; }
  #dropzone {
    width: min(92vw, 640px); border: 2px dashed #e94560; border-radius: 16px;
    padding: 44px 20px; text-align: center; cursor: pointer; margin-top: 16px;
    background: rgba(233,69,96,.06); transition: .2s;
  }
  #dropzone:hover { background: rgba(233,69,96,.12); }
  #dropzone .big { font-size: 40px; }
  #dropzone p { margin-top: 10px; color: #ccc; font-size: 14px; }
  #dropzone small { color: #777; font-size: 12px; }
  #editor { display: none; width: min(94vw, 900px); margin-top: 12px; flex-direction: column; align-items: center; }
  #canvasWrap {
    position: relative; max-width: 100%; border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.5); touch-action: none; cursor: crosshair;
  }
  canvas { display: block; max-width: 100%; height: auto; }
  #maskCanvas { position: absolute; left: 0; top: 0; pointer-events: none; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap; justify-content: center;
  }
  .toolbar label { font-size: 13px; color: #bbb; }
  input[type=range] { width: 120px; accent-color: #e94560; }
  button {
    border: none; border-radius: 999px; padding: 11px 26px; font-size: 15px; cursor: pointer;
    font-weight: 600; transition: .15s;
  }
  #btnInpaint { background: #e94560; color: #fff; }
  #btnInpaint:hover { background: #ff5c78; }
  #btnInpaint:disabled { background: #555; cursor: wait; }
  .ghost { background: rgba(255,255,255,.12); color: #fff; }
  .ghost:hover { background: rgba(255,255,255,.2); }
  #btnDownload { background: #0fbf61; color: #fff; display: none; }
  #result { display: none; width: min(94vw, 900px); margin: 6px 0 30px; flex-direction: column; align-items: center; }
  #result h3 { font-size: 15px; color: #0fbf61; margin-bottom: 10px; }
  #resultCanvas { border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.5); }
  .compare { display: flex; gap: 10px; margin-top: 12px; }
  #progress { display: none; color: #e94560; font-size: 14px; margin: 10px 0; }
  footer { margin-top: auto; padding: 20px; color: #555; font-size: 12px; text-align: center; }
  footer a { color: #e94560; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>去水印 <span>·</span> 图片橡皮擦</h1>
  <p>上传图片 → 涂抹水印 → 一键去除，全程本地处理，不上传服务器</p>
  <div class="steps"><span><b>1</b> 上传</span>→<span><b>2</b> 涂抹水印</span>→<span><b>3</b> 去除</span>→<span><b>4</b> 下载</span></div>
</header>

<div id="dropzone">
  <div class="big">🖼️</div>
  <p>点击选择图片，或拖拽到这里</p>
  <small>支持 JPG / PNG / WebP，图片仅在本地处理</small>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<div id="editor">
  <div id="canvasWrap">
    <canvas id="imgCanvas"></canvas>
    <canvas id="maskCanvas"></canvas>
  </div>
  <div class="toolbar">
    <label>笔刷 <input type="range" id="brushSize" min="4" max="80" value="24"></label>
    <button class="ghost" id="btnClear">清除涂抹</button>
    <button class="ghost" id="btnReset">换一张</button>
    <button id="btnInpaint">✨ 一键去水印</button>
  </div>
  <div id="progress">正在填充… <span id="pct">0%</span></div>
</div>

<div id="result">
  <h3>✅ 处理完成（对比原图：<button class="ghost" id="btnToggle" style="padding:4px 14px;font-size:13px">看原图</button>）</h3>
  <canvas id="resultCanvas"></canvas>
  <div class="compare">
    <button id="btnDownload">⬇ 下载图片</button>
    <button class="ghost" id="btnBack">继续修改</button>
  </div>
</div>

<footer>liuyangdev.site · 纯前端本地处理，不收集任何图片</footer>

<script>
(function(){
  "use strict";
  const MAX_DIM = 1600;
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const editor = document.getElementById('editor');
  const wrap = document.getElementById('canvasWrap');
  const imgC = document.getElementById('imgCanvas');
  const maskC = document.getElementById('maskCanvas');
  const resC = document.getElementById('resultCanvas');
  const result = document.getElementById('result');
  const imgCtx = imgC.getContext('2d');
  const maskCtx = maskC.getContext('2d');
  const resCtx = resC.getContext('2d');
  const brushSize = document.getElementById('brushSize');
  const btnInpaint = document.getElementById('btnInpaint');
  const progress = document.getElementById('progress');
  const pct = document.getElementById('pct');

  let imgW = 0, imgH = 0, drawing = false, lastX = 0, lastY = 0, hasMask = false;
  let origData = null;

  dropzone.onclick = () => fileInput.click();
  dropzone.ondragover = e => { e.preventDefault(); dropzone.style.background = 'rgba(233,69,96,.15)'; };
  dropzone.ondragleave = () => dropzone.style.background = '';
  dropzone.ondrop = e => { e.preventDefault(); dropzone.style.background = ''; if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };
  fileInput.onchange = () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); };

  function loadFile(f) {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, MAX_DIM / Math.max(w, h));
      imgW = Math.round(w * s); imgH = Math.round(h * s);
      for (const c of [imgC, maskC]) { c.width = imgW; c.height = imgH; }
      imgCtx.drawImage(img, 0, 0, imgW, imgH);
      maskCtx.clearRect(0, 0, imgW, imgH);
      origData = imgCtx.getImageData(0, 0, imgW, imgH);
      hasMask = false;
      URL.revokeObjectURL(url);
      dropzone.style.display = 'none';
      editor.style.display = 'flex';
      result.style.display = 'none';
    };
    img.src = url;
  }

  function pos(e) {
    const r = imgC.getBoundingClientRect();
    return [ (e.clientX - r.left) * imgW / r.width, (e.clientY - r.top) * imgH / r.height ];
  }
  function dab(x, y) {
    const r = +brushSize.value / 2;
    maskCtx.fillStyle = 'rgba(233,69,96,.55)';
    maskCtx.beginPath(); maskCtx.arc(x, y, r, 0, 7); maskCtx.fill();
    hasMask = true;
  }
  wrap.addEventListener('pointerdown', e => { drawing = true; [lastX, lastY] = pos(e); dab(lastX, lastY); wrap.setPointerCapture(e.pointerId); });
  wrap.addEventListener('pointermove', e => {
    if (!drawing) return;
    const [x, y] = pos(e);
    const steps = Math.max(1, Math.hypot(x - lastX, y - lastY) / 4);
    for (let i = 1; i <= steps; i++) dab(lastX + (x - lastX) * i / steps, lastY + (y - lastY) * i / steps);
    [lastX, lastY] = [x, y];
  });
  wrap.addEventListener('pointerup', () => drawing = false);

  document.getElementById('btnClear').onclick = () => { maskCtx.clearRect(0,0,imgW,imgH); hasMask = false; };
  document.getElementById('btnReset').onclick = () => { editor.style.display='none'; result.style.display='none'; dropzone.style.display='block'; fileInput.value=''; };
  document.getElementById('btnBack').onclick = () => { result.style.display='none'; editor.style.display='flex'; };

  // ---- Inpainting: BFS 距离变换 + 由外向内逐层填充 ----
  function buildMask() {
    const md = maskCtx.getImageData(0, 0, imgW, imgH).data;
    const m = new Uint8Array(imgW * imgH);
    for (let i = 0; i < m.length; i++) if (md[i*4+3] > 10) m[i] = 1;
    return m;
  }

  function inpaint(src, mask, onTick) {
    return new Promise(resolve => {
      const w = imgW, h = imgH, n = w * h;
      const dist = new Int32Array(n).fill(-1);
      const q = new Int32Array(n); let qh = 0, qt = 0;
      for (let i = 0; i < n; i++) if (!mask[i]) { dist[i] = 0; q[qt++] = i; }
      const t0 = performance.now();
      // 分块 BFS，避免长任务卡死
      (function bfs() {
        const end = Math.min(qt, qh + 400000);
        while (qh < end) {
          const i = q[qh++], x = i % w, y = (i / w) | 0, d = dist[i] + 1;
          if (x > 0 && dist[i-1] < 0) { dist[i-1] = d; q[qt++] = i-1; }
          if (x < w-1 && dist[i+1] < 0) { dist[i+1] = d; q[qt++] = i+1; }
          if (y > 0 && dist[i-w] < 0) { dist[i-w] = d; q[qt++] = i-w; }
          if (y < h-1 && dist[i+w] < 0) { dist[i+w] = d; q[qt++] = i+w; }
        }
        if (qh < qt) { onTick(qh / qt * 0.3); setTimeout(bfs, 0); } else fill();
      })();

      function fill() {
        const order = [];
        for (let i = 0; i < n; i++) if (mask[i]) order.push(i);
        order.sort((a, b) => dist[a] - dist[b]);
        const out = new Uint8ClampedArray(src);
        const R = 10, total = order.length;
        let k = 0;
        (function step() {
          const end = Math.min(total, k + 6000);
          for (; k < end; k++) {
            const i = order[k], x = i % w, y = (i / w) | 0, di = dist[i];
            let r = 0, g = 0, b = 0, ws = 0;
            for (let dy = -R; dy <= R; dy++) {
              const ny = y + dy; if (ny < 0 || ny >= h) continue;
              for (let dx = -R; dx <= R; dx++) {
                if (!dx && !dy) continue;
                const nx = x + dx; if (nx < 0 || nx >= w) continue;
                const ni = ny * w + nx;
                if (dist[ni] >= 0 && dist[ni] < di) {
                  const wt = 1 / (1 + dx*dx + dy*dy);
                  r += out[ni*4] * wt; g += out[ni*4+1] * wt; b += out[ni*4+2] * wt; ws += wt;
                }
              }
            }
            if (ws > 0) { out[i*4] = r/ws; out[i*4+1] = g/ws; out[i*4+2] = b/ws; }
          }
          onTick(0.3 + 0.7 * k / total);
          if (k < total) setTimeout(step, 0);
          else resolve(out);
        })();
      }
    });
  }

  btnInpaint.onclick = async () => {
    if (!hasMask) { alert('先用手指/鼠标涂抹水印区域'); return; }
    btnInpaint.disabled = true;
    progress.style.display = 'block';
    const mask = buildMask();
    const out = await inpaint(origData.data, mask, p => pct.textContent = Math.round(p * 100) + '%');
    resC.width = imgW; resC.height = imgH;
    resCtx.putImageData(new ImageData(out, imgW, imgH), 0, 0);
    progress.style.display = 'none';
    btnInpaint.disabled = false;
    editor.style.display = 'none';
    result.style.display = 'flex';
    document.getElementById('btnDownload').style.display = 'inline-block';
    showingOrig = false;
    document.getElementById('btnToggle').textContent = '看原图';
    result.scrollIntoView({ behavior: 'smooth' });
  };

  let showingOrig = false, resultData = null;
  document.getElementById('btnToggle').onclick = function() {
    if (!resultData) resultData = resCtx.getImageData(0, 0, imgW, imgH);
    showingOrig = !showingOrig;
    resCtx.putImageData(showingOrig ? origData : resultData, 0, 0);
    this.textContent = showingOrig ? '看处理后' : '看原图';
  };

  document.getElementById('btnDownload').onclick = () => {
    const a = document.createElement('a');
    a.download = 'qu-shuiyin-' + Date.now() + '.png';
    a.href = resC.toDataURL('image/png');
    a.click();
  };
})();
</script>
</body>
</html>
