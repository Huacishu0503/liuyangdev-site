<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>慢下来 · 治愈小站</title>
<meta name="description" content="一个让人慢下来的角落：治愈音乐，呼吸练习，什么都不用做。" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: #4a4458;
    overflow: hidden;
    background: linear-gradient(160deg, #fde8d8 0%, #f9dcc4 22%, #e8d8f0 55%, #cfd8f5 80%, #bcd4f0 100%);
    background-size: 300% 300%;
    animation: skyDrift 40s ease-in-out infinite alternate;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes skyDrift {
    0% { background-position: 0% 20%; }
    100% { background-position: 100% 80%; }
  }
  #clouds { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .cloud {
    position: absolute; border-radius: 999px;
    background: rgba(255,255,255,.55);
    filter: blur(28px);
    animation: float linear infinite;
  }
  @keyframes float {
    from { transform: translateX(-30vw); }
    to { transform: translateX(130vw); }
  }
  .sun {
    position: fixed; top: 12%; right: 14%; width: 120px; height: 120px; z-index: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,190,.95) 0%, rgba(255,214,150,.55) 45%, rgba(255,214,150,0) 70%);
    animation: breathe 8s ease-in-out infinite;
  }
  main {
    position: relative; z-index: 1; height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .kicker {
    font-size: 13px; letter-spacing: .5em; text-indent: .5em;
    color: #8a7f9e; margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(44px, 10vw, 84px); font-weight: 600;
    color: #3f3a52; letter-spacing: .12em; text-indent: .12em;
    text-shadow: 0 2px 24px rgba(255,255,255,.6);
    margin-bottom: 14px;
  }
  #quote {
    min-height: 3.2em; max-width: 22em;
    font-size: clamp(16px, 4.4vw, 21px); line-height: 1.9; color: #6b6284;
    transition: opacity .8s ease;
  }
  /* 呼吸圈 */
  #breathWrap { margin: 34px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #breathCircle {
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.85), rgba(255,255,255,.25) 70%);
    border: 1.5px solid rgba(255,255,255,.8);
    box-shadow: 0 8px 40px rgba(150,140,200,.25), inset 0 0 30px rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: #7a7194; letter-spacing: .3em; text-indent: .3em;
    transition: transform 4s ease-in-out;
    cursor: pointer; user-select: none;
  }
  #breathHint { font-size: 12px; color: #9a92b3; letter-spacing: .2em; }
  /* 播放器 */
  #player {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 2;
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.7); border-radius: 999px;
    padding: 10px 18px 10px 10px;
    box-shadow: 0 6px 28px rgba(120,110,160,.18);
    max-width: calc(100vw - 40px);
  }
  #playBtn {
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(135deg, #c9a8e8, #9db8ec);
    color: #fff; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(150,130,200,.4);
  }
  #playBtn:active { transform: scale(.94); }
  #trackMeta { text-align: left; min-width: 0; }
  #trackName { font-size: 13px; color: #4a4458; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
  #trackState { font-size: 11px; color: #9a92b3; letter-spacing: .15em; }
  #nextBtn {
    border: none; background: none; cursor: pointer; font-size: 18px; color: #8a7f9e; padding: 6px; flex-shrink: 0;
  }
  #credit {
    position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 1;
    width: 100%; text-align: center; font-size: 10.5px; color: rgba(120,110,150,.55); letter-spacing: .05em;
    padding: 0 20px;
  }
  /* 入场遮罩 */
  #enter {
    position: fixed; inset: 0; z-index: 10;
    background: linear-gradient(160deg, #fde8d8, #e8d8f0 60%, #cfd8f5);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    transition: opacity 1.2s ease; padding: 24px; text-align: center;
  }
  #enter.hide { opacity: 0; pointer-events: none; }
  #enter .leaf { font-size: 52px; animation: sway 3.5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  #enter p { color: #6b6284; font-size: 17px; line-height: 2; letter-spacing: .1em; }
  #enterBtn {
    border: none; cursor: pointer; font-size: 17px; letter-spacing: .35em; text-indent: .35em;
    color: #fff; padding: 16px 44px; border-radius: 999px;
    background: linear-gradient(135deg, #c9a8e8, #9db8ec);
    box-shadow: 0 8px 30px rgba(150,130,200,.45);
    transition: transform .2s;
  }
  #enterBtn:active { transform: scale(.96); }
  #enter small { color: #9a92b3; font-size: 12px; letter-spacing: .2em; }
</style>
</head>
<body>
<div class="sun"></div>
<div id="clouds"></div>

<main>
  <div class="kicker">治愈小站</div>
  <h1>慢下来</h1>
  <p id="quote">没关系，慢慢来。</p>
  <div id="breathWrap">
    <div id="breathCircle"><span id="breathText">呼吸</span></div>
    <div id="breathHint">跟着圆圈 · 点我开始</div>
  </div>
</main>

<div id="credit">音乐：Placid Ambient / Spiritual Ambient · MusicLFiles（CC BY 4.0，via Wikimedia Commons）</div>

<div id="player">
  <button id="playBtn" aria-label="播放/暂停">▶</button>
  <div id="trackMeta">
    <div id="trackName">Placid Ambient</div>
    <div id="trackState">未 播 放</div>
  </div>
  <button id="nextBtn" aria-label="下一首">⏭</button>
</div>

<audio id="audio" preload="auto" loop></audio>

<div id="enter">
  <div class="leaf">🌿</div>
  <p>这里没什么要追的<br />进来坐一会儿吧</p>
  <button id="enterBtn">进来坐坐</button>
  <small>点一下 · 会有音乐</small>
</div>

<script>
(function(){
  // 云
  var clouds = document.getElementById('clouds');
  for (var i = 0; i < 7; i++) {
    var c = document.createElement('div');
    c.className = 'cloud';
    var w = 120 + Math.random() * 220;
    c.style.width = w + 'px';
    c.style.height = (w * 0.42) + 'px';
    c.style.top = (Math.random() * 70) + '%';
    c.style.animationDuration = (60 + Math.random() * 80) + 's';
    c.style.animationDelay = (-Math.random() * 80) + 's';
    c.style.opacity = 0.35 + Math.random() * 0.35;
    clouds.appendChild(c);
  }

  // 治愈文案轮播
  var quotes = [
    '没关系，慢慢来。',
    '今天也辛苦了，先抱抱自己。',
    '深呼吸，好运正在路上。',
    '允许自己什么都不做一会儿。',
    '你已经做得很好了，真的。',
    '难过的时候，就看看云。',
    '生活偶尔苦，但你很甜。',
    '放过自己，是今天最重要的事。'
  ];
  var qi = 0, qEl = document.getElementById('quote');
  setInterval(function(){
    qEl.style.opacity = 0;
    setTimeout(function(){
      qi = (qi + 1) % quotes.length;
      qEl.textContent = quotes[qi];
      qEl.style.opacity = 1;
    }, 800);
  }, 6000);

  // 音乐
  var tracks = [
    { name: 'Placid Ambient', file: 'placid_ambient' },
    { name: 'Spiritual Ambient', file: 'spiritual_ambient' }
  ];
  var ti = 0;
  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  var nextBtn = document.getElementById('nextBtn');
  var trackName = document.getElementById('trackName');
  var trackState = document.getElementById('trackState');

  function loadTrack(i, autoplay) {
    ti = (i + tracks.length) % tracks.length;
    var t = tracks[ti];
    // 先清空再设，避免残留
    while (audio.firstChild) audio.removeChild(audio.firstChild);
    var s1 = document.createElement('source');
    s1.src = t.file + '.mp3'; s1.type = 'audio/mpeg';
    audio.appendChild(s1);
    trackName.textContent = t.name;
    audio.load();
    if (autoplay) play();
  }
  function play() {
    audio.play().then(function(){
      playBtn.textContent = '⏸';
      trackState.textContent = '播 放 中 ♪';
    }).catch(function(){ trackState.textContent = '点 击 播 放'; });
  }
  function pause() {
    audio.pause();
    playBtn.textContent = '▶';
    trackState.textContent = '已 暂 停';
  }
  playBtn.addEventListener('click', function(){
    if (audio.paused) { if (!audio.currentSrc) loadTrack(ti, true); else play(); }
    else pause();
  });
  nextBtn.addEventListener('click', function(){ loadTrack(ti + 1, !audio.paused || !audio.currentSrc); });
  audio.addEventListener('ended', function(){ /* loop 属性已处理单曲循环 */ });

  // 呼吸练习：4 秒吸气 - 4 秒呼气
  var breathCircle = document.getElementById('breathCircle');
  var breathText = document.getElementById('breathText');
  var breathHint = document.getElementById('breathHint');
  var breathing = false, breathTimer = null, phaseIn = true;
  breathCircle.addEventListener('click', function(){
    if (breathing) {
      breathing = false; clearInterval(breathTimer);
      breathCircle.style.transform = 'scale(1)';
      breathText.textContent = '呼吸'; breathHint.textContent = '跟着圆圈 · 点我开始';
      return;
    }
    breathing = true; breathHint.textContent = '再点一次停止';
    function cycle() {
      if (!breathing) return;
      phaseIn = !phaseIn;
      if (phaseIn) {
        breathCircle.style.transform = 'scale(1.45)';
        breathText.textContent = '吸气';
      } else {
        breathCircle.style.transform = 'scale(1)';
        breathText.textContent = '呼气';
      }
    }
    breathCircle.style.transform = 'scale(1.45)';
    breathText.textContent = '吸气';
    breathTimer = setInterval(cycle, 4000);
  });

  // 入场
  var enter = document.getElementById('enter');
  document.getElementById('enterBtn').addEventListener('click', function(){
    enter.classList.add('hide');
    loadTrack(0, true);
    setTimeout(function(){ enter.style.display = 'none'; }, 1300);
  });
})();
</script>
</body>
</html>
